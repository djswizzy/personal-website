<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include seo.html %}
  <link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/editorial/theme.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/editorial/portfolio.css' | relative_url }}">
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>
<div id="wrapper">
  <div id="main"><div class="inner">
    <header id="header">
      <a class="logo" href="{{ '/' | relative_url }}"><strong>David Calvert</strong></a>
      <nav aria-label="Primary">
        {% for item in site.data.navigation.main %}
          <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </nav>
    </header>
    <main id="content" tabindex="-1">
      {% if page.url == '/' %}{{ content }}{% else %}
        <section class="reading"><header class="major"><h1>{{ page.title }}</h1></header>{{ content }}</section>
      {% endif %}
    </main>
    <footer class="credits">
      <a href="mailto:{{ site.author.email }}">Email David</a>
      <a href="https://github.com/{{ site.author.github }}">GitHub</a>
      <span>Adapted from <a href="https://html5up.net/editorial">Editorial by HTML5 UP</a></span>
    </footer>
  </div></div>
</div>
</body></html>
